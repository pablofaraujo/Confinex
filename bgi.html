<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFAgro — BGI</title>
<link rel="icon" type="image/png" href="./confinex-logo.jpg">
<link rel="apple-touch-icon" href="./confinex-logo.jpg">
<link rel="stylesheet" href="./design/tokens.css?v=20260720-1">
<link rel="stylesheet" href="./design/components.css?v=20260720-1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./js/cfagro-core.js"></script>
<script src="./js/confinados-hedge.js?v=20260803-2"></script>
<script src="./js/cfagro-shell.js?v=20260803-1" defer></script>
</head>
<body data-w="md">

<div id="login" class="login-box card">
<img src="./confinex-logo.jpg" alt="Logo" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:10px">
<h1 style="margin-bottom:2px">BGI</h1>
<div class="sub" style="margin-bottom:18px;letter-spacing:2px;text-transform:uppercase;font-size:10px">Gerenciamento de Posições</div>
<input type="email" id="email" placeholder="seu email" autocomplete="username">
<input type="password" id="senha" placeholder="senha" autocomplete="current-password">
<button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
<div class="err" id="loginErr"></div>
</div>

<div id="app">
<div class="topbar">
<div style="display:flex;align-items:center;gap:12px">
<img src="./confinex-logo.jpg" style="width:44px;height:44px;border-radius:50%;object-fit:cover">
<div>
<h1>BGI</h1>
<div class="sub" id="subtitle"></div>
</div>
</div>
</div>

<div class="kpis" id="kpis"></div>

<h2>Exposição por lote</h2>
<div class="card scroll"><table id="tbExpo"></table></div>

<h2>Nova trava</h2>
<div class="card">
<div class="grid g6">
<div class="fld"><label>Contrato</label><input id="fContrato" placeholder="BGIQ26"></div>
<div class="fld"><label>Direção</label><select id="fDirecao"><option value="vendido">Vendido</option><option value="comprado">Comprado</option></select></div>
<div class="fld"><label>Contratos (cts)</label><input id="fCts" type="number" step="0.01" placeholder="5.00"></div>
<div class="fld"><label>Preço (R$/@)</label><input id="fPreco" type="number" step="0.01" placeholder="346.00"></div>
<div class="fld"><label>Data</label><input id="fData" type="date"></div>
<div class="fld"><label>Alocar ao lote</label><select id="fLote"></select></div>
</div>
<div style="display:flex;gap:10px;align-items:center;margin-top:12px">
<button class="btn" onclick="novaTrava()">＋ Registrar trava</button>
<input id="fObs" placeholder="observações (corretora, termo...)" style="flex:1">
</div>
<div class="msg" id="msgTrava"></div>
</div>

<h2>Posições</h2>
<div class="card scroll"><table id="tbPos"></table></div>

<h2>Cotações BGI</h2>
<div class="card">
<div class="scroll"><table id="tbCot"></table></div>
<div class="grid g6" style="margin-top:12px">
<div class="fld"><label>Contrato</label><input id="cContrato" placeholder="BGIQ26 ou FISICO"></div>
<div class="fld"><label>Preço (R$/@)</label><input id="cPreco" type="number" step="0.01"></div>
<div class="fld"><label>Fonte</label><select id="cFonte"><option>manual</option><option>b3</option><option>cepea</option><option>wey</option></select></div>
<div class="fld"><label>Ref. física?</label><select id="cFisica"><option value="false">Não (futuro)</option><option value="true">Sim (física)</option></select></div>
<div class="fld" style="grid-column:span 2;display:flex;align-items:end"><button class="btn sec" style="width:100%" onclick="novaCotacao()">＋ Registrar cotação</button></div>
</div>
<div class="msg" id="msgCot"></div>
</div>

<div class="foot">Grava direto no banco Confinex — o Dashboard e o Juan enxergam na hora · CFAgro</div>
</div>

<script>
// db, fmtR$, fmtD, cls vêm do js/cfagro-core.js (DS)
const fmtN = (v,d=2) => CFAgro.fmtN(v,d); // BGI usa 2 casas por padrão (contratos/preços)

let LOTES=[], POS=[];
const ehLoteBoiBalanca = codigo => /^BB(?:-|\d)/i.test(String(codigo||'').trim());
const exposicaoDeConfinamento = linhas => (linhas||[]).filter(e=>!ehLoteBoiBalanca(e.codigo));
async function carregar(){
document.getElementById('subtitle').textContent='Carregando...';
const [expo, pos, cot, ops] = await Promise.all([
db.from('v_exposicao_hedge').select('*'),
db.from('posicoes_hedge').select('*, alocacoes_hedge(contratos_qtd, resultado_creditado, operacoes(codigo))').order('created_at',{ascending:false}),
db.from('cotacoes_bgi').select('*').order('data',{ascending:false}).order('created_at',{ascending:false}).limit(30),
db.from('operacoes').select('id,codigo').in('status',['comprada','em_confinamento']).order('codigo')
]);
const err=[expo,pos,cot,ops].find(r=>r.error);
if(err){document.getElementById('subtitle').textContent='Erro: '+err.error.message;return;}
const expoConfinamento=exposicaoDeConfinamento(expo.data);
POS=ConfinadosHedge.deduplicarPosicoes(pos.data);
const exposicaoAtual=ConfinadosHedge.reconciliarExposicao(expoConfinamento,POS);
LOTES=ops.data.filter(o=>!ehLoteBoiBalanca(o.codigo));
document.getElementById('subtitle').textContent='Exposição, posições e cotações de hedge';
document.getElementById('fLote').innerHTML='<option value="">(sem alocação)</option>'+LOTES.map(l=>`<option value="${l.id}">${l.codigo}</option>`).join('');

// KPIs
const nec=exposicaoAtual.reduce((a,e)=>a+Number(e.cts_necessarios||0),0);
const resumoCobertura=ConfinadosHedge.resumirCobertura(POS,nec);
const ab=resumoCobertura.coberturaLiquida;
const desc=resumoCobertura.descobertos;
const realizado=ConfinadosHedge.calcularResultadoRealizado(POS);
document.getElementById('kpis').innerHTML=[
['Contratos necessários',fmtN(nec)+' cts'],['Cobertura cts bolsa',fmtN(ab)+' cts'],
['Contratos descobertos',`<span class="${desc>0.5?'neg':'pos'}">${fmtN(desc)} cts</span>`],
['Arrobas descobertas',fmtN(desc*330,0)+' @']
].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');

// Exposição
document.getElementById('tbExpo').innerHTML='<tr><th>Lote</th><th class="num">@ previstas</th><th class="num">Necessário</th><th class="num">Aberto</th><th class="num">Descoberto</th><th class="num">Creditado</th></tr>'+
exposicaoAtual.sort((a,b)=>a.codigo.localeCompare(b.codigo)).map(e=>{
const d=Number(e.cts_descobertos||0);
return `<tr><td><b>${e.codigo}</b></td><td class="num">${fmtN(e.arrobas_previstas,1)}</td><td class="num">${fmtN(e.cts_necessarios)}</td><td class="num">${fmtN(e.cts_abertos)}</td><td class="num ${d>0.1?'neg':'pos'}">${fmtN(d)}</td><td class="num ${cls(e.hedge_realizado_creditado)}">${fmtR$(e.hedge_realizado_creditado)}</td></tr>`}).join('');

// Última cotação por contrato. Também alimenta a marcação a mercado das
// posições abertas, que antes exibiam apenas o resultado realizado.
const ultimas={};
cot.data.forEach(c=>{const k=c.referencia_fisica?'FISICO':c.contrato; if(!ultimas[k])ultimas[k]=c;});

// Posições
let resultadoAberto=0;
let posicoesCotadas=0;
document.getElementById('tbPos').innerHTML='<tr><th>Contrato</th><th>Dir.</th><th class="num">Cts</th><th class="num">Entrada</th><th class="num">Atual</th><th class="num">Saída</th><th class="num">Resultado</th><th>Lotes</th><th>Status</th><th>Ações</th></tr>'+
POS.map(p=>{
const lotes=(p.alocacoes_hedge||[]).map(a=>a.operacoes?.codigo).filter(Boolean).join(', ')||'—';
const st=p.status==='aberta'?'<span class="badge b-green">Aberta</span>':p.status==='rolada'?'<span class="badge b-blue">Rolada</span>':'<span class="badge b-amber">Encerrada</span>';
const marcacao=ConfinadosHedge.calcularResultadoAberto(p,ultimas[p.contrato]?.preco);
const atual=marcacao?.atual??null;
const parcial=marcacao?.resultado??null;
if(parcial!=null){resultadoAberto+=parcial;posicoesCotadas++;}
const resultado=p.status==='aberta'?parcial:p.resultado_realizado;
const acoes=`<button class="btn mini" onclick="editar('${p.id}')">Editar</button> `+(p.status==='aberta'?`<button class="btn mini warn" onclick="encerrar('${p.id}')">Encerrar</button> <button class="btn mini sec" onclick="encerrarParcial('${p.id}')">Encerrar parcial</button> <button class="btn mini sec" onclick="rolar('${p.id}')">Rolar</button>`:'');
return `<tr><td><b>${p.contrato}</b></td><td>${p.direcao}</td><td class="num">${fmtN(p.contratos_qtd)}</td><td class="num">${fmtN(p.preco_entrada)}</td><td class="num">${atual!=null?fmtN(atual):'—'}</td><td class="num">${p.preco_saida?fmtN(p.preco_saida):'—'}</td><td class="num ${cls(resultado)}">${resultado!=null?fmtR$(resultado):(p.status==='aberta'?'Sem cotação':'—')}</td><td>${lotes}</td><td>${st}</td><td>${acoes}</td></tr>`}).join('');

document.getElementById('kpis').insertAdjacentHTML('beforeend',
  `<div class="kpi"><div class="l">Resultado líquido em aberto</div><div class="v ${cls(resultadoAberto)}">${posicoesCotadas?fmtR$(resultadoAberto):'Sem cotação'}</div></div>`+
  `<div class="kpi"><div class="l">Resultado realizado</div><div class="v ${cls(realizado)}">${fmtR$(realizado)}</div></div>`
);

// Cotações + basis
const fisica=ultimas['FISICO'];
document.getElementById('tbCot').innerHTML='<tr><th>Contrato</th><th class="num">Preço</th><th>Data</th><th>Fonte</th><th class="num">Basis vs física</th></tr>'+
Object.entries(ultimas).map(([k,c])=>{
const basis=(fisica&&!c.referencia_fisica)?Number(fisica.preco)-Number(c.preco):null;
return `<tr><td><b>${k}</b>${c.referencia_fisica?' <span class="badge b-blue">física</span>':''}</td><td class="num">R$ ${fmtN(c.preco)}</td><td>${fmtD(c.data)}</td><td>${c.fonte}</td><td class="num ${basis!=null?(basis>10?'pos':basis<-5?'neg':''):''}">${basis!=null?fmtN(basis):'—'}</td></tr>`}).join('')
|| '<tr><td colspan="5">Nenhuma cotação registrada — registre a primeira abaixo.</td></tr>';
}

async function novaTrava(){
const contrato=document.getElementById('fContrato').value.trim().toUpperCase();
const cts=parseFloat(document.getElementById('fCts').value);
const preco=parseFloat(document.getElementById('fPreco').value);
const data=document.getElementById('fData').value||new Date().toISOString().slice(0,10);
const loteId=document.getElementById('fLote').value;
if(!contrato||!cts||!preco){document.getElementById('msgTrava').textContent='Preencha contrato, cts e preço.';return;}
if(!confirm(`Registrar trava: ${document.getElementById('fDirecao').value} ${cts} cts ${contrato} @ R$${preco}?`))return;
const {data:ins,error}=await db.from('posicoes_hedge').insert({contrato,direcao:document.getElementById('fDirecao').value,contratos_qtd:cts,preco_entrada:preco,data_entrada:data,status:'aberta',obs:document.getElementById('fObs').value||null}).select().single();
if(error){document.getElementById('msgTrava').textContent='Erro: '+error.message;return;}
if(loteId){await db.from('alocacoes_hedge').insert({posicao_id:ins.id,operacao_id:loteId,contratos_qtd:cts});}
document.getElementById('msgTrava').textContent=`✓ Trava registrada (${contrato}, ${cts} cts).`;
carregar();
}

function numeroInformado(texto, atual){
const valor=prompt(texto,String(atual??'').replace('.',','));
if(valor===null)return null;
const numero=parseFloat(String(valor).replace(',','.'));
return Number.isFinite(numero)?numero:NaN;
}

async function editar(id){
const p=POS.find(x=>x.id===id);
if(!p){alert('Posição não encontrada — atualize a página.');return;}
const contrato=prompt('Contrato:',p.contrato);
if(contrato===null)return;
const direcao=prompt('Direção (vendido ou comprado):',p.direcao);
if(direcao===null)return;
const dir=String(direcao).trim().toLowerCase();
if(!['vendido','comprado'].includes(dir)){alert('Direção inválida. Use vendido ou comprado.');return;}
const cts=numeroInformado('Quantidade de contratos:',p.contratos_qtd);
if(cts===null)return;
const entrada=numeroInformado('Preço de entrada (R$/@):',p.preco_entrada);
if(entrada===null)return;
const dataEntrada=prompt('Data de entrada (AAAA-MM-DD):',p.data_entrada||'');
if(dataEntrada===null)return;
const obs=prompt('Observações:',p.obs||'');
if(obs===null)return;
if(!String(contrato).trim()||!Number.isFinite(cts)||cts<=0||!Number.isFinite(entrada)||entrada<=0){alert('Contrato, quantidade ou preço inválido.');return;}

const alteracoes={contrato:String(contrato).trim().toUpperCase(),direcao:dir,contratos_qtd:cts,preco_entrada:entrada,data_entrada:dataEntrada||null,obs:obs||null};
let resultadoCorrigido=null;
if(p.status!=='aberta'){
  const saida=numeroInformado('Preço de saída (R$/@):',p.preco_saida);
  if(saida===null)return;
  if(!Number.isFinite(saida)||saida<=0){alert('Preço de saída inválido.');return;}
  const mult=dir==='vendido'?1:-1;
  alteracoes.preco_saida=saida;
  resultadoCorrigido=Math.round(mult*(entrada-saida)*cts*330*100)/100;
  alteracoes.resultado_realizado=resultadoCorrigido;
}
if(!confirm(`Salvar alterações em ${alteracoes.contrato}: ${fmtN(cts)} cts ${dir} @ R$ ${fmtN(entrada)}?`))return;

const {error}=await db.from('posicoes_hedge').update(alteracoes).eq('id',id);
if(error){alert('Erro ao salvar: '+error.message);return;}

// Mantém o rateio proporcional quando a quantidade total é corrigida.
const alocs=p.alocacoes_hedge||[];
const totalAnterior=alocs.reduce((s,a)=>s+Number(a.contratos_qtd||0),0);
if(totalAnterior>0&&cts!==Number(p.contratos_qtd)){
  const {data:linhas}=await db.from('alocacoes_hedge').select('id,contratos_qtd').eq('posicao_id',id);
  for(const a of (linhas||[])){
    const qtdCorrigida=Math.round(Number(a.contratos_qtd)*cts/totalAnterior*100)/100;
    const credito=resultadoCorrigido==null?undefined:Math.round(resultadoCorrigido*qtdCorrigida/cts*100)/100;
    const ajuste={contratos_qtd:qtdCorrigida};
    if(credito!==undefined)ajuste.resultado_creditado=credito;
    await db.from('alocacoes_hedge').update(ajuste).eq('id',a.id);
  }
}else if(resultadoCorrigido!=null&&totalAnterior>0){
  const {data:linhas}=await db.from('alocacoes_hedge').select('id,contratos_qtd').eq('posicao_id',id);
  for(const a of (linhas||[])){
    await db.from('alocacoes_hedge').update({resultado_creditado:Math.round(resultadoCorrigido*Number(a.contratos_qtd)/totalAnterior*100)/100}).eq('id',a.id);
  }
}
alert('Posição atualizada com sucesso.');
carregar();
}

async function encerrar(id){
const p=POS.find(x=>x.id===id);
const saida=parseFloat(prompt(`Encerrar ${p.contrato} (${fmtN(p.contratos_qtd)} cts ${p.direcao} @ ${fmtN(p.preco_entrada)}).\nPreço de saída (R$/@):`));
if(!saida)return;
const mult=p.direcao==='vendido'?1:-1;
const resultado=Math.round(mult*(Number(p.preco_entrada)-saida)*Number(p.contratos_qtd)*330*100)/100;
if(!confirm(`Resultado: ${fmtR$(resultado)}.\nSerá CREDITADO aos lotes alocados e a exposição deles volta a aberta. Confirmar?`))return;
await db.from('posicoes_hedge').update({status:'encerrada',preco_saida:saida,data_saida:new Date().toISOString().slice(0,10),resultado_realizado:resultado}).eq('id',id);
const {data:alocRows}=await db.from('alocacoes_hedge').select('id,contratos_qtd').eq('posicao_id',id);
const tot=(alocRows||[]).reduce((a,x)=>a+Number(x.contratos_qtd),0)||1;
for(const a of (alocRows||[])){
await db.from('alocacoes_hedge').update({resultado_creditado:Math.round(resultado*Number(a.contratos_qtd)/tot*100)/100}).eq('id',a.id);
}
carregar();
}

async function encerrarParcial(id){
const p=POS.find(x=>x.id===id);
if(!p){ alert('Posição não encontrada — atualize a página.'); return; }
const totalCts=Number(p.contratos_qtd);
const qtdStr=prompt(`Encerrar parcialmente ${p.contrato} (${fmtN(totalCts)} cts ${p.direcao} @ ${fmtN(p.preco_entrada)}).\nQuantos contratos encerrar agora? (menos que ${fmtN(totalCts)} — para fechar tudo, use "Encerrar")`);
if(qtdStr===null) return;
const qtdFechar=parseFloat(String(qtdStr).replace(',','.'));
if(!qtdFechar || qtdFechar<=0 || qtdFechar>=totalCts){
  alert('Quantidade inválida. Informe um número maior que 0 e menor que '+fmtN(totalCts)+'. Para encerrar tudo, use o botão "Encerrar".');
  return;
}
const saida=parseFloat(prompt(`Preço de saída (R$/@) para os ${fmtN(qtdFechar)} cts encerrados:`));
if(!saida) return;

const mult=p.direcao==='vendido'?1:-1;
const resultado=Math.round(mult*(Number(p.preco_entrada)-saida)*qtdFechar*330*100)/100;
const restante=Math.round((totalCts-qtdFechar)*100)/100;

if(!confirm(`Encerrar parcialmente ${p.contrato}: ${fmtN(qtdFechar)} cts @ R$${fmtN(saida)} → resultado ${fmtR$(resultado)}.\nFicam ${fmtN(restante)} cts em aberto.\nO resultado será creditado apenas à parte fechada. Confirmar?`)) return;

const {error:e1}=await db.from('posicoes_hedge').update({contratos_qtd:restante}).eq('id',p.id);
if(e1){ alert('Erro ao ajustar a posição original: '+e1.message); return; }

const {data:ins,error:e2}=await db.from('posicoes_hedge').insert({
  contrato:p.contrato, direcao:p.direcao, contratos_qtd:qtdFechar,
  preco_entrada:p.preco_entrada, data_entrada:p.data_entrada,
  status:'encerrada', preco_saida:saida, data_saida:new Date().toISOString().slice(0,10),
  resultado_realizado:resultado, obs:'Fechamento parcial de '+p.contrato+(p.obs?' — '+p.obs:'')
}).select().single();
if(e2){ alert('A posição original foi reduzida para '+fmtN(restante)+' cts, mas houve erro ao criar a parte encerrada: '+e2.message); return; }

const {data:alocRows}=await db.from('alocacoes_hedge').select('id,operacao_id,contratos_qtd').eq('posicao_id',p.id);
for(const a of (alocRows||[])){
  const aQtd=Number(a.contratos_qtd);
  const aFechar=Math.round(aQtd*qtdFechar/totalCts*100)/100;
  const aRestante=Math.round((aQtd-aFechar)*100)/100;
  if(aFechar>0){
    await db.from('alocacoes_hedge').insert({
      posicao_id:ins.id, operacao_id:a.operacao_id, contratos_qtd:aFechar,
      resultado_creditado:Math.round(resultado*aFechar/qtdFechar*100)/100
    });
  }
  if(aRestante>0){
    await db.from('alocacoes_hedge').update({contratos_qtd:aRestante}).eq('id',a.id);
  } else {
    await db.from('alocacoes_hedge').delete().eq('id',a.id);
  }
}
carregar();
}

async function rolar(id){
const p=POS.find(x=>x.id===id);
const novoContrato=prompt(`Rolar ${p.contrato} → novo contrato (ex.: BGIV26):`);
if(!novoContrato)return;
const saida=parseFloat(prompt('Preço de saída do contrato atual (R$/@):'));
const entrada=parseFloat(prompt('Preço de entrada do novo contrato (R$/@):'));
if(!saida||!entrada)return;
const mult=p.direcao==='vendido'?1:-1;
const resultado=Math.round(mult*(Number(p.preco_entrada)-saida)*Number(p.contratos_qtd)*330*100)/100;
if(!confirm(`Rolagem: encerra ${p.contrato} com ${fmtR$(resultado)} e abre ${p.contratos_qtd} cts em ${novoContrato.toUpperCase()} @ ${entrada}. Confirmar?`))return;
const {data:nova}=await db.from('posicoes_hedge').insert({contrato:novoContrato.toUpperCase(),direcao:p.direcao,contratos_qtd:p.contratos_qtd,preco_entrada:entrada,data_entrada:new Date().toISOString().slice(0,10),status:'aberta',obs:'rolagem de '+p.contrato}).select().single();
await db.from('posicoes_hedge').update({status:'rolada',preco_saida:saida,data_saida:new Date().toISOString().slice(0,10),resultado_realizado:resultado,rolada_para:nova.id}).eq('id',id);
const alocs=(p.alocacoes_hedge||[]);
const tot=alocs.reduce((a,x)=>a+Number(x.contratos_qtd),0)||1;
const {data:alocRows}=await db.from('alocacoes_hedge').select('id,operacao_id,contratos_qtd').eq('posicao_id',id);
for(const a of (alocRows||[])){
await db.from('alocacoes_hedge').update({resultado_creditado:Math.round(resultado*Number(a.contratos_qtd)/tot*100)/100}).eq('id',a.id);
await db.from('alocacoes_hedge').insert({posicao_id:nova.id,operacao_id:a.operacao_id,contratos_qtd:a.contratos_qtd});
}
carregar();
}

async function novaCotacao(){
const contrato=document.getElementById('cContrato').value.trim().toUpperCase();
const preco=parseFloat(document.getElementById('cPreco').value);
if(!contrato||!preco){document.getElementById('msgCot').textContent='Preencha contrato e preço.';return;}
const fisica=document.getElementById('cFisica').value==='true';
const {error}=await db.from('cotacoes_bgi').insert({contrato:fisica?'FISICO':contrato,data:new Date().toISOString().slice(0,10),preco,fonte:document.getElementById('cFonte').value,referencia_fisica:fisica});
document.getElementById('msgCot').textContent=error?'Erro: '+error.message:'✓ Cotação registrada.';
