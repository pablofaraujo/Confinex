@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:${A.bg};color:${A.text};font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;line-height:1.55;min-height:100vh}
.app{max-width:1180px;margin:0 auto;padding:28px 16px 100px}
.hdr{display:flex;align-items:flex-start;gap:20px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid ${A.border}}
.logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:700;color:${A.accent};letter-spacing:-.5px;line-height:1}
.logo-sub{font-size:10px;color:${A.muted};letter-spacing:2px;text-transform:uppercase;margin-top:3px;font-weight:400}
.sec{background:${A.card};border:1px solid ${A.border};border-radius:14px;padding:22px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec-t{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:${A.accent};margin-bottom:18px;display:flex;align-items:center;gap:10px}
.sec-t::after{content:'';flex:1;height:1px;background:${A.border}}
.sec-t.nm::after{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.g2,.g3,.g4{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:10px;font-weight:600;color:${A.label};letter-spacing:.5px;text-transform:uppercase}
input,select{background:${A.surface};border:1px solid ${A.border};border-radius:8px;color:${A.text};font-family:'DM Mono',monospace;font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
input:focus,select:focus{border-color:${A.accent};box-shadow:0 0 0 3px ${A.accentDim}}
input[readonly]{color:${A.accent};font-weight:600;cursor:default;background:${A.accentDim};border-color:transparent}
select option{background:white}
.hint{font-size:10px;color:${A.muted};margin-top:3px}
.dvdr{height:1px;background:${A.border};margin:18px 0}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tb{background:${A.surface};border:1.5px solid ${A.border};border-radius:8px;color:${A.label};cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:500;padding:7px 13px;transition:all .15s;line-height:1.2}
.tb.on{background:${A.accentDim};border-color:${A.accent};color:${A.accent};font-weight:700}
.tb:hover:not(.on){border-color:#BDC3CC;color:${A.text}}
.sc-bar{display:flex;align-items:stretch;border-bottom:1px solid ${A.border};overflow-x:auto;gap:2px;padding:0 22px}
.sc-tab{background:transparent;border:none;border-bottom:2.5px solid transparent;color:${A.muted};cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;padding:10px 14px;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;margin-bottom:-1px}
.sc-tab.on{border-bottom-color:var(--c);color:var(--c)}
.sc-tab:hover:not(.on){color:${A.label}}
.sc-del{background:none;border:none;color:${A.red};cursor:pointer;font-size:14px;opacity:.35;padding:0 2px;transition:opacity .15s}
.sc-del:hover{opacity:1}
.sc-add{background:none;border:1.5px dashed ${A.border};border-radius:8px;color:${A.muted};cursor:pointer;font-size:18px;padding:2px 12px;transition:all .15s;align-self:center;margin-left:4px;margin-bottom:4px;line-height:1.5}
.sc-add:hover{border-color:${A.accent};color:${A.accent}}
.sc-body{padding:22px}
.warn{background:#FEF9EC;border:1px solid #F0D58C;border-radius:8px;color:#92640A;font-size:11px;padding:9px 13px;margin-top:10px}
.ck{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.ck input[type=checkbox]{width:15px;height:15px;accent-color:${A.accent};cursor:pointer;flex-shrink:0}
.ck span{font-size:12px;color:${A.label}}
.calc-btn{background:${A.accent};border:none;border-radius:10px;color:#fff;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;padding:15px;width:100%;margin-top:18px;transition:opacity .15s,transform .1s;letter-spacing:.2px}
.calc-btn:hover{opacity:.9;transform:translateY(-1px)}
.calc-btn:active{transform:none}
.res-wrap{margin-top:30px}
.res-ttl{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:700;color:${A.text};margin-bottom:4px}
.res-sub{font-size:11px;color:${A.muted};margin-bottom:20px}
.rank-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.rcard{flex:1;min-width:155px;background:${A.surface};border-radius:12px;padding:16px;border:1.5px solid ${A.border};box-shadow:0 1px 4px rgba(0,0,0,.05)}
.rcard.best{border-color:var(--c);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.rn{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:700;color:var(--c);line-height:1}
.rname{font-size:12px;font-weight:600;color:${A.text};margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtype{font-size:9px;color:${A.muted};letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.rval{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;margin-top:9px}
.rval.pos{color:${A.green}}
.rval.neg{color:${A.red}}
.rsub{font-size:10px;color:${A.muted};font-family:'DM Mono',monospace;margin-top:2px}
.tbl-wrap{overflow-x:auto}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:12px}
.cmp-tbl th{padding:9px 13px;font-size:9px;font-weight:600;color:${A.muted};letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid ${A.border};text-align:right;white-space:nowrap;background:${A.bg}}
.cmp-tbl th:first-child{text-align:left;min-width:190px}
.cmp-tbl th.sc-th{color:var(--c);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700}
.cmp-tbl td{padding:9px 13px;border-bottom:1px solid ${A.border};font-family:'DM Mono',monospace;text-align:right;color:${A.text};white-space:nowrap}
.cmp-tbl td:first-child{text-align:left;font-family:'Plus Jakarta Sans',sans-serif;color:${A.label};font-size:11px}
.cmp-tbl tr:last-child td{border-bottom:none}
.cmp-tbl tr.grp td{padding-top:14px;border-top:2px solid ${A.border};color:${A.accent};font-weight:600;font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-family:'Plus Jakarta Sans',sans-serif;background:${A.bg}}
.cmp-tbl tr.tot td{font-size:13px;font-weight:700;background:#F9FAFB}
.pos{color:${A.green}}
