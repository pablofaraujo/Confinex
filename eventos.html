<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFAgro — Eventos</title>
<link rel="icon" type="image/png" href="./confinex-logo.jpg">
<link rel="stylesheet" href="./design/tokens.css?v=20260720-1">
<link rel="stylesheet" href="./design/components.css?v=20260720-1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./js/cfagro-core.js"></script>
<script src="./js/cfagro-gestao.js?v=20260723-1"></script>
<script src="./js/eventos.js?v=20260723-2" defer></script>
<script src="./js/cfagro-shell.js?v=20260723-1" defer></script>
</head>
<body data-w="md">
<div id="login" class="login-box card">
  <img class="logo-img" src="./confinex-logo.jpg" alt="Logo Confinex" width="72" height="72">
  <h1>Eventos</h1>
  <div class="sub">Acesso protegido ao histórico operacional</div>
  <input type="email" id="email" placeholder="seu email" autocomplete="username">
  <input type="password" id="senha" placeholder="senha" autocomplete="current-password">
  <button class="btn" id="entrarBtn">Entrar</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app">
  <div class="topbar">
    <div class="ident">
      <img class="logo-img" src="./confinex-logo.jpg" alt="" width="48" height="48">
      <div><h1>Eventos</h1><div class="sub" id="subtitle">Carregando histórico…</div></div>
    </div>
    <div class="acoes"><button class="btn sec" id="atualizarBtn">↻ Atualizar</button><button class="btn sec" id="sairBtn">Sair</button></div>
  </div>

  <h2>Histórico operacional</h2>
  <div class="card">
    <div class="simgrid">
      <div class="fld"><label for="filtroSituacao">Situação</label><select id="filtroSituacao"><option value="todas">Todas</option></select></div>
      <div class="fld"><label for="filtroTexto">Buscar</label><input id="filtroTexto" type="search" placeholder="tipo, contexto, responsável ou descrição"></div>
    </div>
    <div class="scroll"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Contexto</th><th>Situação</th><th>Responsável</th></tr></thead><tbody id="listaEventos"></tbody></table></div>
  </div>
  <div class="foot">Histórico em linguagem humana · estruturas JSON e IDs técnicos permanecem ocultos.</div>
</div>
</body>
</html>
