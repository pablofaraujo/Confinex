<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFAgro — Revisões</title>
<link rel="icon" type="image/png" href="./confinex-logo.jpg">
<link rel="apple-touch-icon" href="./confinex-logo.jpg">
<link rel="stylesheet" href="./design/tokens.css?v=20260720-1">
<link rel="stylesheet" href="./design/components.css?v=20260815-1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
<script src="./js/cfagro-core.js?v=20260720-1"></script>
<script src="./js/cfagro-shell.js?v=20260815-1" defer></script>
<style>
body{max-width:1480px}.toolbar{display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:10px;align-items:end;margin-top:16px}.review-layout{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(520px,1.35fr);gap:14px;margin-top:14px}.review-list{display:grid;gap:8px;max-height:72vh;overflow:auto}.review-item{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--yellow);border-radius:var(--r-sm);padding:12px;cursor:pointer}.review-item:hover,.review-item.active{background:var(--field);border-color:var(--yellow)}.review-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.review-title{font-weight:700;color:var(--navy);font-size:14px;white-space:normal;line-height:1.35}.review-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;white-space:normal}.section{border-top:1px solid var(--border-soft);padding-top:14px;margin-top:14px}.section:first-child{border-top:none;padding-top:0;margin-top:0}.section-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid .wide{grid-column:1/-1}.confirm-box{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.confirm-box .mini-card{background:var(--field);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:10px;min-height:66px}.mini-card .l{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}.mini-card .v{font-size:15px;font-weight:700;color:var(--navy);margin-top:4px;overflow-wrap:anywhere}.context-ok{border-left-color:var(--green)}.context-bad{border-left-color:var(--red)}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.empty{padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.danger{background:var(--red)}.danger:hover{background:#9f1d24}.small-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}.locked{background:var(--amberbg);color:var(--amber-text);border:1px solid #ead59b;border-radius:var(--r-sm);padding:10px;font-size:12px;margin-top:10px}textarea{min-height:82px}.readonly{background:#fff}.decision{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px}.promotion-preview{background:var(--field);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:10px;font-size:12px;line-height:1.6;white-space:normal}.promotion-preview b{color:var(--navy)}@media(max-width:1100px){.confirm-box,.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:920px){.toolbar,.review-layout,.form-grid,.form-grid.two,.confirm-box{grid-template-columns:1fr}.review-list{max-height:none}}
</style>
<style>
.business-block{border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:12px;background:#fff;margin-bottom:10px}
.business-block-title{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:10px}
.business-block .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.business-block .fld.wide{grid-column:1/-1}
.promotion-summary{display:grid;gap:8px}
.promotion-row{display:grid;grid-template-columns:minmax(130px,.45fr) minmax(0,1fr);gap:8px;align-items:start;border-bottom:1px solid var(--border-soft);padding-bottom:7px}
.promotion-row:last-child{border-bottom:none;padding-bottom:0}
.promotion-label{color:var(--muted);font-weight:700}
.promotion-value{color:var(--navy);font-weight:700;overflow-wrap:anywhere}
@media(max-width:920px){.business-block .form-grid,.promotion-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login-box card">
  <img src="./confinex-logo.jpg" alt="Logo" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:10px">
  <h1>Revisões</h1>
  <div class="sub" style="margin-bottom:18px;letter-spacing:2px;text-transform:uppercase;font-size:10px">Conferência · ajuste · aprovação</div>
  <input type="email" id="email" placeholder="seu email" autocomplete="username">
  <input type="password" id="senha" placeholder="senha" autocomplete="current-password">
  <button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app">
  <div class="topbar"><div class="ident"><div><h1>Revisões</h1><div class="sub" id="subtitle">Conferência, ajuste e aprovação antes do lançamento.</div></div></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="kpis"><div id="quickFilters"></div><div id="contextSummary"></div></div>
  <div class="toolbar card"><div class="fld"><label>Busca</label><input id="busca" placeholder="Fornecedor, CF, grupo, resumo..." oninput="renderLista()"></div><div class="fld"><label>Contexto</label><select id="fContexto" onchange="renderLista()"><option value="">Todos</option></select></div><div class="fld"><label>Status</label><select id="fStatus" onchange="renderLista()"><option value="abertos">Todos os abertos</option><option value="todos">Todo o histórico</option><option value="prioridade_alta">Precisa da sua conferência</option><option value="aguardando_revisao">Aguardando revisão</option><option value="campos_faltantes">Com campos faltantes</option><option value="promocao_aguardando">Promoção aguardando confirmação</option><option value="em_execucao">Promoção em andamento</option><option value="executado">Promoção concluída</option><option value="erro_pos_gravacao">Precisa conferir lançamento</option><option value="rejeitados_cancelados">Rejeitados ou cancelados</option><option value="confirmado_telegram">Confirmado no Telegram</option><option value="em_revisao">Em revisão</option><option value="realizado">Realizado</option></select></div><button class="btn" onclick="carregar()">Carregar</button></div>
  <div class="review-layout"><section><h2>Fila de revisão</h2><div class="review-list" id="lista"></div></section><section><h2>Conferência e aprovação</h2><div class="card" id="detalhe"><div class="empty">Selecione um item da fila.</div></div></section></div>
  <div class="footer">Revisões Confinex · ajuste de rascunhos e pendências, sem gravar compra/venda/lote definitivo automaticamente.</div>
</div>

<script src="./revisoes.js?v=20260803-1"></script>
</body>
</html>
