name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test do endereço publicado
        env:
          URL_PUBLICA: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          base="${URL_PUBLICA%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/confinamento.html" | grep -q 'tbAcompanhamento'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/painel-boi-gordo.html" | grep -q 'dados/painel-boi-gordo.json'
