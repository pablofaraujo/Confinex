name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test do endereço publicado
        env:
          URL_PUBLICA: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          base="${URL_PUBLICA%/}"
          confinex_html="$(mktemp)"
          confinex_bundle="$(mktemp)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/confinex.html" --output "$confinex_html"
          grep -q '__CONFINEX_BUILD = "20260804-ui-1"' "$confinex_html"
          grep -q '__CONFINEX_CARREGAR_APP' "$confinex_html"
          grep -q 'confinex-supabase-ponte-inline.js' "$confinex_html"
          if grep -q '\\n[[:space:]]*<script' "$confinex_html"; then
            echo "confinex.html contem quebra de linha literal entre scripts" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/confinex-app.mobile.js?v=20260804-ui-1" --output "$confinex_bundle"
          if grep -q 'Object\.hasOwn' "$confinex_bundle"; then
            echo "bundle publicado exige Object.hasOwn e nao suporta Safari 14" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/confinamento.html" | grep -q 'tbAcompanhamento'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/painel-boi-gordo.html" | grep -q 'dados/painel-boi-gordo.json'
