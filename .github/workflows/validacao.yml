name: Validação do ecossistema

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Segunda-feira, 07:17 em Brasília (10:17 UTC).
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-ecossistema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar bateria local
        run: python3 tools/test_ecossistema.py
