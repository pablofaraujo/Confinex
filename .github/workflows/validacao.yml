name: Validação do ecossistema

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Segunda-feira, 07:17 em Brasília (10:17 UTC).
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-ecossistema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências das ferramentas Python
        run: python3 -m pip install -r requirements-tools.txt
      - name: Instalar dependências da auditoria
        run: npm ci
      - name: Instalar Chromium e WebKit
        run: npx playwright install chromium webkit --with-deps
      - name: Rodar bateria local
        run: python3 tools/test_ecossistema.py
      - name: Validar migração em PostgreSQL descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          python3 tools/test_migracao_postgres.py --obrigatorio
          python3 tools/test_complemento_comissao_postgres.py --obrigatorio
      - name: Auditar páginas em desktop e celular
        run: >-
          python3 tools/auditar_ecossistema.py
          --navegador
          --saida-json artifacts/auditoria-ecossistema/relatorio.json
          --saida-md artifacts/auditoria-ecossistema/relatorio.md
      - name: Publicar evidências da auditoria
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-ecossistema
          path: artifacts/auditoria-ecossistema/
          retention-days: 30
