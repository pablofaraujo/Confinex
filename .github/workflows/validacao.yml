name: Validação do ecossistema

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Segunda-feira, 07:17 em Brasília (10:17 UTC).
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-ecossistema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências da auditoria
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install chromium --with-deps
      - name: Rodar bateria local
        run: python3 tools/test_ecossistema.py
      - name: Auditar páginas em desktop e celular
        run: >-
          python3 tools/auditar_ecossistema.py
          --navegador
          --modo-descoberta
          --saida-json artifacts/auditoria-ecossistema/relatorio.json
          --saida-md artifacts/auditoria-ecossistema/relatorio.md
      - name: Publicar evidências da auditoria
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ecossistema
          path: artifacts/auditoria-ecossistema/
          retention-days: 30
