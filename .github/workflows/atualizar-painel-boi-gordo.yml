name: Atualizar Painel Boi Gordo

on:
  schedule:
    - cron: '32 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel-boi-gordo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Buscar e validar fonte
        id: fonte
        run: |
          if python3 tools/atualizar_painel_boi_gordo.py; then
            echo "atualizado=true" >> "$GITHUB_OUTPUT"
          else
            echo "B3 indisponível; último artefato válido preservado"
            echo "::error::Painel não atualizado: a B3 falhou ou devolveu dados inválidos"
            echo "### Painel bloqueado" >> "$GITHUB_STEP_SUMMARY"
            echo "A consulta oficial da B3 falhou ou devolveu dados inválidos. O último dado válido foi preservado." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publicar artefato atualizado
        if: steps.fonte.outputs.atualizado == 'true'
        run: |
          git config user.name 'Confinex bot'
          git config user.email 'confinex-bot@users.noreply.github.com'
          git add dados/painel-boi-gordo.json
          git diff --cached --quiet || git commit -m 'Atualiza Painel Boi Gordo'
          git push
