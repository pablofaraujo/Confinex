name: Atualizar Painel Boi Gordo

on:
  schedule:
    - cron: '32 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel-boi-gordo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar e validar fonte
        id: fonte
        env:
          PAINEL_BOI_GORDO_SOURCE_URL: ${{ vars.PAINEL_BOI_GORDO_SOURCE_URL }}
        run: |
          set -u
          if [ -z "${PAINEL_BOI_GORDO_SOURCE_URL}" ]; then
            echo "bloqueado: PAINEL_BOI_GORDO_SOURCE_URL não configurada"
            echo "::error::Painel não atualizado: falta configurar a fonte validada de mercado"
            echo "### Painel bloqueado" >> "$GITHUB_STEP_SUMMARY"
            echo "A agenda rodou, mas a fonte validada ainda não está configurada. O último dado válido foi preservado." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if python3 tools/atualizar_painel_boi_gordo.py; then
            echo "atualizado=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fonte indisponível; último artefato válido preservado"
            echo "::error::Painel não atualizado: a fonte configurada falhou ou devolveu dados inválidos"
            echo "### Painel bloqueado" >> "$GITHUB_STEP_SUMMARY"
            echo "A fonte configurada falhou ou devolveu dados inválidos. O último dado válido foi preservado." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publicar artefato atualizado
        if: steps.fonte.outputs.atualizado == 'true'
        run: |
          git config user.name 'Confinex bot'
          git config user.email 'confinex-bot@users.noreply.github.com'
          git add dados/painel-boi-gordo.json
          git diff --cached --quiet || git commit -m 'Atualiza Painel Boi Gordo'
          git push
