          "react-dom/client": "https://esm.sh/react-dom@19.2.6/client",

    <script>
      window.CONFINEX_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbz3FgKsNmGBaoo2A2IeuBiSTbG0w1apwugKYQeJvPfv-o7taxJJHi6IhJOxy_F2vIrL/exec";

  <body>
    <div id="root"></div>
    <script type="module" src="./confinex-app.latest.js?v=fase0-patch-2026-07-08"></script>
  
<a href="./" style="position:fixed;bottom:18px;right:18px;z-index:9999;background:#fff;border:1px solid #e3e9e5;border-radius:999px;padding:10px 16px;font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;color:#182b21;text-decoration:none;box-shadow:0 2px 10px rgba(15,23,42,.15)">⌂ Central</a>

<!-- Botão de foto do caderno de pesagem — fora do React (não toca no bundle). Envia a foto para a tela de conferência OCR. -->
<button id="btnPesagem" style="position:fixed;bottom:64px;right:18px;z-index:9999;background:#059669;border:none;border-radius:999px;padding:10px 16px;font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;color:#fff;cursor:pointer;box-shadow:0 2px 10px rgba(15,23,42,.15)">📷 Pesagem</button>
<input id="fotoPesagem" type="file" accept="image/*" capture="environment" style="display:none">
<script>
(function(){
  var btn=document.getElementById('btnPesagem'), inp=document.getElementById('fotoPesagem');
  btn.addEventListener('click',function(){ inp.click(); });
  inp.addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var img=new Image(), rd=new FileReader();
    rd.onload=function(ev){
      img.onload=function(){
        // reduz para no máximo 1600px (leve para armazenar e enviar ao VPS)
        var max=1600, w=img.width, h=img.height, s=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var data=c.toDataURL('image/jpeg',0.85);
        try{
          sessionStorage.setItem('ocrp:handoff', JSON.stringify({ mime:'image/jpeg', data:data.split(',')[1], origem:'confinex' }));
          location.href='./ocr-pesagem.html';
        }catch(err){ alert('Não consegui preparar a foto: '+err.message); }
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  });
})();
</script>
</body>
</html>
