<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F5F6F8" />
    <title>Confinex - Pablo Ferreira</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://cdn.jsdelivr.net/npm/react@19.2.6/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.2.6/client/+esm",
          "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@19.2.6/jsx-runtime/+esm"
        }
      }
    </script>
    <script>
      window.CONFINEX_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbz3FgKsNmGBaoo2A2IeuBiSTbG0w1apwugKYQeJvPfv-o7taxJJHi6IhJOxy_F2vIrL/exec";
      window.__CONFINEX_BOOT_OK = false;
      window.addEventListener('error', function (event) {
        var box = document.getElementById('boot-status');
        if (box) {
          box.style.display = 'block';
          box.innerHTML = '<b>Erro ao abrir o Confinex</b><br>' + (event.message || 'Falha ao carregar o aplicativo.') + '<br><small>Build 20260719-4</small>';
        }
      });
      setTimeout(function () {
        if (window.__CONFINEX_BOOT_OK) return;
        var box = document.getElementById('boot-status');
        if (box) {
          box.style.display = 'block';
          box.innerHTML = '<b>O aplicativo não terminou de carregar.</b><br>Recarregue a página. Se persistir, o bloqueio está no carregamento dos módulos externos.<br><small>Build 20260719-4</small>';
        }
      }, 12000);
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot-status{margin:24px;padding:16px;border:1px solid #e5b94f;border-radius:10px;background:#fff8df;color:#6d4b00;line-height:1.5}
    </style>
  </head>
  <body>
    <div id="boot-status">Abrindo Confinex… <small>Build 20260719-4</small></div>
    <div id="root"></div>
    <script type="module">
      import './confinex-app.latest.js?v=20260719-4';
      window.__CONFINEX_BOOT_OK = true;
      const box = document.getElementById('boot-status');
      if (box) box.style.display = 'none';
    </script>
  </body>
</html>
