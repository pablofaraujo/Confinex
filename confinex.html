<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F5F6F8" />
    <title>Confinex - Pablo Ferreira</title>
    <link rel="icon" type="image/png" href="./confinex-logo.jpg" />
    <link rel="apple-touch-icon" href="./confinex-logo.jpg" />
    <link rel="stylesheet" href="./design/tokens.css?v=20260720-1" />
    <link rel="stylesheet" href="./design/components.css?v=20260721-2" />
    <script src="./js/cfagro-shell.js?v=20260723-2" defer></script>
    <script>
      window.CONFINEX_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbz3FgKsNmGBaoo2A2IeuBiSTbG0w1apwugKYQeJvPfv-o7taxJJHi6IhJOxy_F2vIrL/exec";
      window.__CONFINEX_BOOT_OK = false;
      window.addEventListener('error', function (event) {
        if (window.__CONFINEX_BOOT_OK) return;
        var box = document.getElementById('boot-status');
        if (box) {
          box.style.display = 'block';
          box.innerHTML = '<b>Erro ao abrir o Confinex</b><br>' + (event.message || 'Falha ao carregar o aplicativo.') + '<br><a href="./confinex.html?v=20260721-13">Tentar novamente</a><br><small>Build 20260721-13</small>';
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (window.__CONFINEX_BOOT_OK) return;
        var box = document.getElementById('boot-status');
        if (box) {
          var motivo = event.reason && event.reason.message ? event.reason.message : 'Falha inesperada durante a abertura.';
          box.style.display = 'block';
          box.innerHTML = '<b>Erro ao abrir o Confinex</b><br>' + motivo + '<br><a href="./confinex.html?v=20260721-13">Tentar novamente</a><br><small>Build 20260721-13</small>';
        }
      });
      setTimeout(function () {
        if (window.__CONFINEX_BOOT_OK) return;
        var box = document.getElementById('boot-status');
        if (box) {
          box.style.display = 'block';
          box.innerHTML = '<b>O aplicativo não terminou de carregar.</b><br><a href="./confinex.html?v=20260721-13">Tentar novamente</a><br><small>Build 20260721-13</small>';
        }
      }, 12000);
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot-status{margin:24px;padding:16px;border:1px solid #e5b94f;border-radius:10px;background:#fff8df;color:#6d4b00;line-height:1.5}
    </style>
  </head>
  <body>
    <div id="boot-status">Abrindo Confinex… <small>Build 20260721-13</small></div>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var box = document.getElementById('boot-status');
        var observer = new MutationObserver(function () {
          if (!root || !root.firstElementChild) return;
          window.__CONFINEX_BOOT_OK = true;
          if (box) box.style.display = 'none';
          observer.disconnect();
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script defer src="./confinex-app.mobile.js?v=20260721-13"></script>
    <script>
      (function () {
        function carregarSupabaseSemBloquear() {
          var sdk = document.createElement('script');
          sdk.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
          sdk.async = true;
          sdk.onload = function () {
            var core = document.createElement('script');
            core.src = './js/cfagro-core.js?v=20260721-2';
            core.async = true;
            document.head.appendChild(core);
          };
          document.head.appendChild(sdk);
        }
        if (document.readyState === 'complete') setTimeout(carregarSupabaseSemBloquear, 0);
        else window.addEventListener('load', carregarSupabaseSemBloquear, { once: true });
      })();
    </script>
  </body>
</html>
