<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F5F6F8" />
    <title>Confinex - Pablo Ferreira</title>
    <link rel="icon" type="image/png" href="./confinex-logo.jpg" />
    <link rel="apple-touch-icon" href="./confinex-logo.jpg" />
    <link rel="stylesheet" href="./design/tokens.css?v=20260720-1" />
    <link rel="stylesheet" href="./design/components.css?v=20260721-2" />
<script src="./js/cfagro-shell.js?v=20260803-1" defer></script>
    <script>
      window.CONFINEX_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbz3FgKsNmGBaoo2A2IeuBiSTbG0w1apwugKYQeJvPfv-o7taxJJHi6IhJOxy_F2vIrL/exec";
      window.__CONFINEX_BUILD = "20260803-sheets-1";
      window.__CONFINEX_BOOT_OK = false;
      window.__CONFINEX_APP_INICIADO = false;
      window.__CONFINEX_CARGA_TENTATIVAS = 0;
      window.__CONFINEX_TEMPO_RECARGA_MS = window.__CONFINEX_TEMPO_RECARGA_MS || 12000;
      window.__CONFINEX_TEMPO_FALHA_MS = window.__CONFINEX_TEMPO_FALHA_MS || 20000;
      window.__CONFINEX_MOSTRAR_STATUS = function (titulo, detalhe, permitirTentativa) {
        var box = document.getElementById('boot-status');
        if (!box || window.__CONFINEX_BOOT_OK) return;
        var acao = permitirTentativa
          ? '<br><a href="#" id="confinex-tentar-novamente">Tentar novamente</a>'
          : '';
        box.style.display = 'block';
        box.innerHTML = '<b>' + titulo + '</b>' + (detalhe ? '<br>' + detalhe : '') + acao + '<br><small>Build ' + window.__CONFINEX_BUILD + '</small>';
        var tentar = document.getElementById('confinex-tentar-novamente');
        if (tentar) tentar.onclick = function (event) {
          event.preventDefault();
          window.__CONFINEX_CARREGAR_APP(true);
        };
      };
      window.__CONFINEX_CARREGAR_APP = function (novaCopia) {
        if (window.__CONFINEX_BOOT_OK || window.__CONFINEX_APP_INICIADO) return;
        if (novaCopia && window.__CONFINEX_SCRIPT_ATUAL) {
          window.__CONFINEX_SCRIPT_ATUAL.remove();
        }
        window.__CONFINEX_CARGA_TENTATIVAS += 1;
        var script = document.createElement('script');
        var versao = encodeURIComponent(window.__CONFINEX_BUILD);
        script.src = './confinex-app.mobile.js?v=' + versao + (novaCopia ? '&recarga=' + Date.now() : '');
        script.async = true;
        script.dataset.confinexApp = 'true';
        script.onerror = function () {
          script.remove();
          if (window.__CONFINEX_CARGA_TENTATIVAS < 2) {
            window.__CONFINEX_MOSTRAR_STATUS('A conexão demorou.', 'Buscando uma nova cópia do aplicativo…', false);
            window.__CONFINEX_CARREGAR_APP(true);
          } else {
            window.__CONFINEX_MOSTRAR_STATUS('Não foi possível abrir o Confinex.', 'Confira a conexão e tente novamente.', true);
          }
        };
        window.__CONFINEX_SCRIPT_ATUAL = script;
        document.head.appendChild(script);
      };
      window.addEventListener('error', function (event) {
        if (window.__CONFINEX_BOOT_OK) return;
        window.__CONFINEX_MOSTRAR_STATUS('Não foi possível abrir o Confinex.', 'O aplicativo encontrou uma falha durante a abertura.', true);
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (window.__CONFINEX_BOOT_OK) return;
        window.__CONFINEX_MOSTRAR_STATUS('Não foi possível abrir o Confinex.', 'O aplicativo encontrou uma falha durante a abertura.', true);
      });
      setTimeout(function () {
        if (window.__CONFINEX_BOOT_OK) return;
        window.__CONFINEX_MOSTRAR_STATUS('A conexão demorou.', 'Tentando novamente com uma nova cópia…', false);
        if (window.__CONFINEX_CARGA_TENTATIVAS < 2) window.__CONFINEX_CARREGAR_APP(true);
        setTimeout(function () {
          if (!window.__CONFINEX_BOOT_OK) {
            window.__CONFINEX_MOSTRAR_STATUS('Não foi possível abrir o Confinex.', 'Confira a conexão e tente novamente.', true);
          }
        }, window.__CONFINEX_TEMPO_FALHA_MS);
      }, window.__CONFINEX_TEMPO_RECARGA_MS);
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot-status{margin:24px;padding:16px;border:1px solid #e5b94f;border-radius:10px;background:#fff8df;color:#6d4b00;line-height:1.5}
    </style>
  </head>
  <body>
    <div id="boot-status">Abrindo Confinex… <small>Build 20260803-sheets-1</small></div>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var box = document.getElementById('boot-status');
        var observer = new MutationObserver(function () {
          if (!root || !root.firstElementChild) return;
          window.__CONFINEX_BOOT_OK = true;
          if (box) box.style.display = 'none';
          observer.disconnect();
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="./js/confinex-supabase-ponte-inline.js?v=20260724-3"></script>
    <script>window.__CONFINEX_CARREGAR_APP(false);</script>
    <script>
      (function () {
        function carregarSupabaseSemBloquear() {
          var sdk = document.createElement('script');
          sdk.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
          sdk.async = true;
          sdk.onload = function () {
            var core = document.createElement('script');
            core.src = './js/cfagro-core.js?v=20260721-2';
            core.async = true;
            document.head.appendChild(core);
          };
          document.head.appendChild(sdk);
        }
        if (document.readyState === 'complete') setTimeout(carregarSupabaseSemBloquear, 0);
        else window.addEventListener('load', carregarSupabaseSemBloquear, { once: true });
      })();
    </script>
  </body>
</html>
